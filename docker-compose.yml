services:
  firewall:
    build:
      context: ./firewall
      dockerfile: Dockerfile
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      WEB_IP: 172.29.0.10
      ADMIN_IP: ${ADMIN_IP:-172.28.0.1}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?.env 파일에 ADMIN_PASSWORD를 설정하세요}
    ports:
      - "${WEB_PORT:-80}:80"
      - "${SSH_PORT:-2222}:22"
    restart: unless-stopped
    networks:
      edge-net:
        ipv4_address: 172.28.0.2
        gw_priority: 100
      backend-net:
        ipv4_address: 172.29.0.2

  webserver:
    image: nginx:alpine
    volumes:
      - ./webserver/index.html:/usr/share/nginx/html/index.html:ro
      - ./webserver/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      backend-net:
        ipv4_address: 172.29.0.10

networks:
  edge-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
