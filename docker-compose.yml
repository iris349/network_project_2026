
services:
  firewall:
    image: alpine:3.20
    command: ["sh", "-c", "sleep infinity"]

    # 방화벽 설정에 필요한 네트워크 관리 권한
    cap_add:
      - NET_ADMIN

    # IP 패킷 전달 활성화
    sysctls:
      net.ipv4.ip_forward: "1"

    # 외부 요청은 방화벽 컨테이너로 전달
    ports:
      - "127.0.0.1:8080:80"

    networks:
      edge-net:
        ipv4_address: 172.28.0.2
      backend-net:
        ipv4_address: 172.29.0.2

  webserver:
    image: nginx:alpine

    volumes:
      - ./webserver/index.html:/usr/share/nginx/html/index.html:ro
      - ./webserver/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    # 웹서버는 내부 네트워크에만 연결
    networks:
      backend-net:
        ipv4_address: 172.29.0.10

networks:
  edge-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

  backend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
